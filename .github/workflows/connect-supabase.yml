name: Connect PrestaYa to Supabase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase scripts into V2
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script type="module" src="supabase/bridge.js"></script>', '<script src="supabase/bridge.js"></script>', 1)
          for tag in ['<script src="supabase/admin-setup.js"></script>', '<script src="supabase/auth-portal.js"></script>']:
              if tag not in s:
                  s = s.replace('</html>', tag + '</html>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit connection
        shell: bash
        run: |
          git config user.name 'PrestaYa Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Supabase scripts already connected.'
          else
            git commit -m 'Wire authentication portal to Supabase'
            git push
          fi
