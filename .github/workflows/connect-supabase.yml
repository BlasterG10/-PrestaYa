name: Connect PrestaYa to Supabase

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase bridge and admin UI into V2
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script type="module" src="supabase/bridge.js"></script>'
          new = '<script src="supabase/bridge.js"></script>'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              marker = '</html>'
              if marker not in s:
                  raise SystemExit('index.html: </html> not found')
              s = s.replace(marker, new + marker, 1)
          admin = '<script src="supabase/admin-setup.js"></script>'
          if admin not in s:
              marker = '</html>'
              s = s.replace(marker, admin + marker, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit connection
        shell: bash
        run: |
          git config user.name 'PrestaYa Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Supabase connection already current.'
          else
            git commit -m 'Connect initial admin and administration UI'
            git push
          fi
