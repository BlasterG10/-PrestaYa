name: PrestaYa Auth UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-auth-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject clean auth and dashboard UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          auth='<script src="supabase/auth-ui.js"></script>'
          css='<link rel="stylesheet" href="supabase/dashboard-ui.css">'
          if auth not in s:
              marker='</head>'
              if marker not in s: raise SystemExit('Missing </head>')
              s=s.replace(marker, auth+marker, 1)
          if css not in s:
              marker='</head>'
              if marker not in s: raise SystemExit('Missing </head>')
              s=s.replace(marker, css+marker, 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'PrestaYa Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html supabase/dashboard-ui.css
          if git diff --cached --quiet; then echo 'UI already current.'; else git commit -m 'Modernize PrestaYa dashboard'; git push; fi
